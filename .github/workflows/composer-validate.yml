name: Composer Validate

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  composer-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Validate composer.json
        run: composer validate --no-check-lock
