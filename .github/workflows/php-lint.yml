name: PHP Lint

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Lint PHP files outside vendor
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
